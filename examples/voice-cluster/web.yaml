apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-web
  namespace: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: voice-web
  template:
    metadata:
      labels:
        app: voice-web
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: jtstormz/voice-web:0.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 20090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: voice-web
  namespace: livekit
spec:
  type: NodePort
  selector:
    app: voice-web
  ports:
    - name: http
      port: 20090
      targetPort: http
      nodePort: 30900
      protocol: TCP
