apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-stt
  namespace: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper-stt
  template:
    metadata:
      labels:
        app: whisper-stt
    spec:
      nodeSelector:
        macnative.dev/runtime: darwin-arm64
      tolerations:
        - key: macnative.dev/runtime
          operator: Equal
          value: darwin-arm64
          effect: NoSchedule
      hostNetwork: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: whisper
          image: whisper-base-en:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
