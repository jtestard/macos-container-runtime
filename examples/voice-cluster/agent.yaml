apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-agent
  namespace: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: voice-agent
  template:
    metadata:
      labels:
        app: voice-agent
    spec:
      nodeSelector:
        macnative.dev/runtime: darwin-arm64
      tolerations:
        - key: macnative.dev/runtime
          operator: Equal
          value: darwin-arm64
          effect: NoSchedule
      hostNetwork: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: agent
          image: jtstormz/voice-agent:0.1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 20083
