apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-tts
  namespace: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kokoro-tts
  template:
    metadata:
      labels:
        app: kokoro-tts
    spec:
      nodeSelector:
        macnative.dev/runtime: darwin-arm64
      tolerations:
        - key: macnative.dev/runtime
          operator: Equal
          value: darwin-arm64
          effect: NoSchedule
      hostNetwork: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: kokoro
          image: kokoro-mps:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8880
