apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-inf-server
  namespace: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: go-inf-server
  template:
    metadata:
      labels:
        app: go-inf-server
    spec:
      nodeSelector:
        macnative.dev/runtime: darwin-arm64
        macnative.dev/slot: llm
      tolerations:
        - key: macnative.dev/runtime
          operator: Equal
          value: darwin-arm64
          effect: NoSchedule
      hostNetwork: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: server
          image: jtstormz/tiny-web:llama-server-001
          imagePullPolicy: Never
          args:
            - -m
            - models/SmolLM2-360M-Instruct-Q8_0.gguf
            - --port
            - "8080"
          volumeMounts:
            - name: llama-model
              mountPath: /app/models
              readOnly: true
          ports:
            - containerPort: 8080
      volumes:
        - name: llama-model
          hostPath:
            path: /absolute/path/to/go-inf-server/models/smollm2-360m
            type: Directory
