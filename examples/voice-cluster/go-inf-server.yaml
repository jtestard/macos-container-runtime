apiVersion: apps/v1
kind: Deployment
# Template: render __MODEL_DIR__ as an absolute Mac path before applying.
metadata:
  name: go-inf-server
  namespace: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: go-inf-server
  template:
    metadata:
      labels:
        app: go-inf-server
    spec:
      nodeSelector:
        macnative.dev/runtime: darwin-arm64
      tolerations:
        - key: macnative.dev/runtime
          operator: Equal
          value: darwin-arm64
          effect: NoSchedule
      hostNetwork: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: server
          image: jtstormz/tiny-web:llama-server-001
          imagePullPolicy: Never
          args:
            - -m
            - models/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
            - --port
            - "8080"
            - --n-gpu-layers
            - "16"
            - --load-mode
            - none
          volumeMounts:
            - name: llama-model
              mountPath: /app/models
              readOnly: true
          ports:
            - containerPort: 8080
      volumes:
        - name: llama-model
          hostPath:
            path: __MODEL_DIR__
            type: Directory
