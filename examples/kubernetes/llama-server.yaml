apiVersion: apps/v1
kind: Deployment
metadata:
  name: macnative-llama
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: macnative-llama
  template:
    metadata:
      labels:
        app: macnative-llama
    spec:
      nodeSelector:
        macnative.dev/runtime: darwin-arm64
        macnative.dev/slot: llama
      tolerations:
        - key: macnative.dev/runtime
          operator: Equal
          value: darwin-arm64
          effect: NoSchedule
      hostNetwork: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: llama-server
          image: jtstormz/tiny-web:llama-server-001
          imagePullPolicy: Never
          args:
            - -m
            - models/SmolLM2-360M-Instruct-Q8_0.gguf
          volumeMounts:
            - name: model
              mountPath: /app/models
              readOnly: true
          ports:
            - containerPort: 8082
      volumes:
        - name: model
          hostPath:
            path: __MODEL_DIR__
            type: Directory
